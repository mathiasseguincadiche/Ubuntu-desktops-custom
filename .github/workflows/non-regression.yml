name: non-regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real-machine gate must remain closed
        run: |
          grep -F 'REAL_MACHINE_APPROVED=false' config/virtualization.conf
          if grep -R -n -E '^REAL_MACHINE_APPROVED=(true|1|yes)$' config; then
            echo 'Real-machine gate opened unexpectedly.' >&2
            exit 1
          fi
      - name: KVM custom NAT contract
        run: |
          grep -F 'KVM_NETWORK_CIDR=192.168.50.0/24' config/virtualization.conf
          grep -F 'KVM_GATEWAY=192.168.50.254' config/virtualization.conf
          grep -F 'KVM_DHCP_START=192.168.50.100' config/virtualization.conf
          grep -F 'KVM_DHCP_END=192.168.50.200' config/virtualization.conf
          grep -F 'KVM_BLOCK_PHYSICAL_LAN=true' config/virtualization.conf
          grep -F 'KVM_PRESERVE_EXISTING_FIREWALL=true' config/virtualization.conf
          grep -F 'VM_DEVOPS_NETWORK=devops-nat' config/devops-vm.conf
      - name: No obvious destructive firewall flushes
        run: |
          if grep -R -n -E '(^|[[:space:]])(nft[[:space:]]+flush[[:space:]]+ruleset|iptables[[:space:]]+-F)([[:space:]]|$)' --include='*.sh' .; then
            echo 'Forbidden global firewall flush detected.' >&2
            exit 1
          fi
