name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Unit tests
        run: bats tests/unit
      - name: Integration tests
        run: bats tests/integration
      - name: Dry-run contract tests
        run: bats tests/dry-run
