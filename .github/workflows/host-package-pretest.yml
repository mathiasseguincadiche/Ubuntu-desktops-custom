name: host-package-pretest

on:
  pull_request:
    paths:
      - 'modules/host/**'
      - 'manifests/host/**'
      - 'scripts/vendor/**'
      - 'modules/virtualization/**'
      - 'manifests/virtualization/**'
      - 'scripts/kvm/**'
      - '.github/workflows/host-package-pretest.yml'
  push:
    branches: [main]
    paths:
      - 'modules/host/**'
      - 'manifests/host/**'
      - 'scripts/vendor/**'
      - 'modules/virtualization/**'
      - 'manifests/virtualization/**'
      - 'scripts/kvm/**'
      - '.github/workflows/host-package-pretest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-2604-host-packages:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable Ubuntu desktop repositories and refresh metadata
        shell: bash
        run: |
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y multiverse
          sudo apt-get update
      - name: Validate required HOST and KVM packages resolve
        shell: bash
        run: |
          set -u -o pipefail
          packages=(
            mesa-vulkan-drivers mesa-utils vulkan-tools intel-media-va-driver vainfo intel-gpu-tools
            ca-certificates curl gnupg jq flatpak software-properties-common
            filezilla xournalpp remmina remmina-plugin-rdp remmina-plugin-vnc remmina-plugin-secret
            libreoffice libreoffice-gnome nautilus-admin nautilus-image-converter
            ghostwriter
            gamemode gamescope mangohud mangoapp
            nvme-cli smartmontools lm-sensors lshw usbutils pciutils ethtool powertop v4l-utils
            pipewire-bin wireplumber
            qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients
            virt-install virt-manager virt-viewer spice-client-gtk swtpm swtpm-tools
            libvirglrenderer1 osinfo-db
          )
          failed=0
          for package in "${packages[@]}"; do
            candidate="$(apt-cache policy "$package" 2>/dev/null | awk '/Candidate:/ {print $2; exit}' || true)"
            if [[ -z "$candidate" || "$candidate" == '(none)' ]]; then
              echo "MISSING: $package" >&2
              failed=1
            else
              echo "PASS: $package -> $candidate"
            fi
          done
          exit "$failed"
      - name: Validate preferred vendor APT sources and provenance
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo install -d -m 0755 /etc/apt/keyrings /usr/share/keyrings

          curl -fsSLo "$RUNNER_TEMP/mozilla.gpg" https://packages.mozilla.org/apt/repo-signing-key.gpg
          mozilla_fpr="$(gpg --batch --show-keys --with-colons "$RUNNER_TEMP/mozilla.gpg" | awk -F: '$1=="fpr" {print $10; exit}')"
          [[ "$mozilla_fpr" == '35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3' ]]
          sudo install -m 0644 "$RUNNER_TEMP/mozilla.gpg" /etc/apt/keyrings/packages.mozilla.org.asc
          sudo tee /etc/apt/sources.list.d/mozilla.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://packages.mozilla.org/apt
          Suites: mozilla
          Components: main
          Signed-By: /etc/apt/keyrings/packages.mozilla.org.asc
          EOF
          sudo tee /etc/apt/preferences.d/mozilla >/dev/null <<'EOF'
          Package: *
          Pin: origin packages.mozilla.org
          Pin-Priority: 1000
          EOF

          curl -fsSLo "$RUNNER_TEMP/microsoft.asc" https://packages.microsoft.com/keys/microsoft.asc
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/microsoft.gpg" "$RUNNER_TEMP/microsoft.asc"
          sudo install -m 0644 "$RUNNER_TEMP/microsoft.gpg" /usr/share/keyrings/microsoft-vscode.gpg
          sudo tee /etc/apt/sources.list.d/vscode.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://packages.microsoft.com/repos/code
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: /usr/share/keyrings/microsoft-vscode.gpg
          EOF

          curl -fsSLo "$RUNNER_TEMP/brave.gpg" https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo install -m 0644 "$RUNNER_TEMP/brave.gpg" /usr/share/keyrings/brave-browser-archive-keyring.gpg
          curl -fsSLo "$RUNNER_TEMP/brave.sources" https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo install -m 0644 "$RUNNER_TEMP/brave.sources" /etc/apt/sources.list.d/brave-browser-release.sources

          curl -fsSLo "$RUNNER_TEMP/onlyoffice.asc" https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/onlyoffice.gpg" "$RUNNER_TEMP/onlyoffice.asc"
          sudo install -m 0644 "$RUNNER_TEMP/onlyoffice.gpg" /usr/share/keyrings/onlyoffice.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/onlyoffice.gpg] https://download.onlyoffice.com/repo/debian squeeze main' \
            | sudo tee /etc/apt/sources.list.d/onlyoffice.list >/dev/null

          curl -fsSLo "$RUNNER_TEMP/steam.gpg" https://repo.steampowered.com/steam/archive/stable/steam.gpg
          sudo install -m 0644 "$RUNNER_TEMP/steam.gpg" /usr/share/keyrings/steam.gpg
          echo 'deb [arch=amd64,i386 signed-by=/usr/share/keyrings/steam.gpg] https://repo.steampowered.com/steam/ stable steam' \
            | sudo tee /etc/apt/sources.list.d/steam-stable.list >/dev/null
          sudo dpkg --add-architecture i386

          sudo apt-get update

          declare -A expected_origin=(
            [firefox]='packages.mozilla.org'
            [code]='packages.microsoft.com'
            [brave-browser]='brave-browser-apt-release.s3.brave.com'
            [onlyoffice-desktopeditors]='download.onlyoffice.com'
            [steam-launcher]='repo.steampowered.com'
          )
          failed=0
          for package in "${!expected_origin[@]}"; do
            policy="$(apt-cache policy "$package" 2>/dev/null || true)"
            candidate="$(awk '/Candidate:/ {print $2; exit}' <<<"$policy")"
            if [[ -z "$candidate" || "$candidate" == '(none)' ]]; then
              echo "MISSING VENDOR CANDIDATE: $package" >&2
              failed=1
              continue
            fi
            if ! grep -Fq "${expected_origin[$package]}" <<<"$policy"; then
              echo "WRONG VENDOR ORIGIN: $package expected ${expected_origin[$package]}" >&2
              failed=1
              continue
            fi
            echo "PASS VENDOR CANDIDATE: $package -> $candidate (${expected_origin[$package]})"
          done
          (( failed == 0 )) || exit "$failed"

          for package in firefox code brave-browser onlyoffice-desktopeditors steam-launcher; do
            sudo apt-get --simulate -y install "$package" >/dev/null
            echo "PASS VENDOR INSTALL SIMULATION: $package"
          done
      - name: Validate Proton Mail Stable Linux DEB
        shell: bash
        run: |
          set -Eeuo pipefail
          metadata="$RUNNER_TEMP/proton-mail-version.json"
          deb="$RUNNER_TEMP/ProtonMail-desktop-beta.deb"
          curl -fsSLo "$metadata" https://proton.me/download/mail/linux/version.json
          release_json="$(jq -c '[.Releases[] | select(.CategoryName == "Stable")][0]' "$metadata")"
          version="$(jq -r '.Version' <<<"$release_json")"
          url="$(jq -r '.File[] | select(.Identifier | test("\\.deb")) | .Url' <<<"$release_json" | head -n1)"
          expected="$(jq -r '.File[] | select(.Identifier | test("\\.deb")) | .Sha512CheckSum' <<<"$release_json" | head -n1)"
          [[ "$url" == "https://proton.me/download/mail/linux/$version/ProtonMail-desktop-beta.deb" ]]
          [[ "$expected" =~ ^[0-9a-fA-F]{128}$ ]]
          curl -fsSLo "$deb" "$url"
          printf '%s  %s\n' "$expected" "$deb" | sha512sum --check --status
          package_name="$(dpkg-deb -f "$deb" Package)"
          [[ "$package_name" == proton-mail ]]
          sudo apt-get --simulate -y install "$deb" >/dev/null
          echo "PASS PROTON MAIL: $version ($package_name)"
      - name: Validate DuckDuckGo official Linux integration targets
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSI https://addons.mozilla.org/firefox/downloads/latest/duckduckgo-for-firefox/latest.xpi >/dev/null
          curl -fsSI 'https://duckduckgo.com/?q=test' >/dev/null
          grep -F 'jid1-ZAdIEUB7XOzOJw@jetpack' scripts/vendor/configure_duckduckgo.sh
          grep -F 'DefaultSearchProviderName' scripts/vendor/configure_duckduckgo.sh
      - name: Validate preferred Flathub applications
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y flatpak
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          for app_id in \
            com.bitwarden.desktop \
            com.obsproject.Studio \
            com.mattjakeman.ExtensionManager; do
            sudo flatpak remote-info --system flathub "$app_id" >/dev/null
            echo "PASS FLATHUB: $app_id"
          done
      - name: Validate current official Ubuntu OS catalog
        shell: bash
        run: |
          chmod +x scripts/kvm/refresh_os_catalog.sh
          OS_CATALOG_STATE_DIR="$RUNNER_TEMP/os-catalog" scripts/kvm/refresh_os_catalog.sh
          grep -Fx 'status=verified' "$RUNNER_TEMP/os-catalog/os-catalog.resolved"
          grep -F 'artifact=ubuntu-26.04-desktop-amd64.iso|sha256=' "$RUNNER_TEMP/os-catalog/os-catalog.resolved"
          grep -F 'artifact=ubuntu-26.04-live-server-amd64.iso|sha256=' "$RUNNER_TEMP/os-catalog/os-catalog.resolved"
          grep -F 'artifact=ubuntu-26.04-server-cloudimg-amd64.img|sha256=' "$RUNNER_TEMP/os-catalog/os-catalog.resolved"
