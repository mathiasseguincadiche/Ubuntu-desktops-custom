name: host-package-pretest

on:
  pull_request:
    paths:
      - 'modules/host/**'
      - 'manifests/host/**'
      - 'modules/virtualization/**'
      - 'manifests/virtualization/**'
      - 'scripts/kvm/**'
      - '.github/workflows/host-package-pretest.yml'
  push:
    branches: [main]
    paths:
      - 'modules/host/**'
      - 'manifests/host/**'
      - 'modules/virtualization/**'
      - 'manifests/virtualization/**'
      - 'scripts/kvm/**'
      - '.github/workflows/host-package-pretest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-2604-host-packages:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable Ubuntu desktop repositories and refresh metadata
        shell: bash
        run: |
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y multiverse
          sudo apt-get update
      - name: Validate required HOST and KVM packages resolve
        shell: bash
        run: |
          set -u -o pipefail
          packages=(
            mesa-vulkan-drivers mesa-utils vulkan-tools intel-media-va-driver vainfo intel-gpu-tools
            gnome-shell-extension-manager
            steam-installer steam-devices gamemode gamescope mangohud mangoapp
            nvme-cli smartmontools lm-sensors lshw usbutils pciutils ethtool powertop v4l-utils
            pipewire-bin wireplumber
            qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients
            virt-install virt-manager virt-viewer spice-client-gtk swtpm swtpm-tools
            libvirglrenderer1 osinfo-db
          )
          failed=0
          for package in "${packages[@]}"; do
            candidate="$(apt-cache policy "$package" 2>/dev/null | awk '/Candidate:/ {print $2; exit}' || true)"
            if [[ -z "$candidate" || "$candidate" == '(none)' ]]; then
              echo "MISSING: $package" >&2
              failed=1
            else
              echo "PASS: $package -> $candidate"
            fi
          done
          exit "$failed"
      - name: Validate current official Ubuntu OS catalog
        shell: bash
        run: |
          chmod +x scripts/kvm/refresh_os_catalog.sh
          OS_CATALOG_STATE_DIR="$RUNNER_TEMP/os-catalog" scripts/kvm/refresh_os_catalog.sh
          grep -Fx 'status=verified' "$RUNNER_TEMP/os-catalog/os-catalog.resolved"
          grep -F 'artifact=ubuntu-26.04-desktop-amd64.iso|sha256=' "$RUNNER_TEMP/os-catalog/os-catalog.resolved"
          grep -F 'artifact=ubuntu-26.04-live-server-amd64.iso|sha256=' "$RUNNER_TEMP/os-catalog/os-catalog.resolved"
          grep -F 'artifact=ubuntu-26.04-server-cloudimg-amd64.img|sha256=' "$RUNNER_TEMP/os-catalog/os-catalog.resolved"
