name: shell-quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: ShellCheck entrypoints
        run: shellcheck -x -S warning ./*.sh
      - name: ShellCheck common engine blocking errors
        run: shellcheck -x -S error lib/*.sh
      - name: ShellCheck common engine advisory warnings
        continue-on-error: true
        run: shellcheck -x -S warning lib/*.sh
