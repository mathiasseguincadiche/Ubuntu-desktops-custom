name: shell-quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: ShellCheck common engine and entrypoints
        # SC2034/SC2329 are intentionally excluded for sourced libraries:
        # public globals/functions are consumed by other modules at runtime.
        run: shellcheck -x -e SC2034,SC2329 lib/*.sh ./*.sh
