# Optional KVM VM profiles. These profiles are never created by the default workstation installation.
# ubuntu-devops remains the only VM provisioned by the main installation workflow.

VM_PROFILE_NETWORK=devops-nat
VM_PROFILE_POOL=devops-data
VM_PROFILE_AUTOSTART=false

# Ubuntu Desktop 26.04 LTS — high-performance virtual desktop.
UBUNTU_DESKTOP_VM_NAME=ubuntu-desktop
UBUNTU_DESKTOP_VM_OS=ubuntu-desktop-26.04-lts
UBUNTU_DESKTOP_VM_VCPU=6
UBUNTU_DESKTOP_VM_RAM_MB=8192
UBUNTU_DESKTOP_VM_DISK_GB=100
UBUNTU_DESKTOP_VM_DISK_FORMAT=qcow2
UBUNTU_DESKTOP_VM_FIRMWARE=uefi
UBUNTU_DESKTOP_VM_MACHINE=q35
UBUNTU_DESKTOP_VM_CPU_MODE=host-passthrough
UBUNTU_DESKTOP_VM_DISK_BUS=virtio
UBUNTU_DESKTOP_VM_NET_MODEL=virtio
UBUNTU_DESKTOP_VM_DISPLAY=spice
UBUNTU_DESKTOP_VM_VIDEO=virtio
UBUNTU_DESKTOP_VM_GL=true
UBUNTU_DESKTOP_VM_RENDER_NODE=/dev/dri/renderD128
UBUNTU_DESKTOP_VM_3D_ACCEL=true
UBUNTU_DESKTOP_VM_SPICE_AGENT=true
UBUNTU_DESKTOP_VM_AUDIO=pipewire
UBUNTU_DESKTOP_VM_USB_REDIRECTION=true

# Windows 11 — TPM 2.0 + UEFI/Secure Boot capable profile.
WINDOWS11_VM_NAME=windows-11
WINDOWS11_VM_OS=windows-11
WINDOWS11_VM_VCPU=8
WINDOWS11_VM_RAM_MB=16384
WINDOWS11_VM_DISK_GB=200
WINDOWS11_VM_DISK_FORMAT=qcow2
WINDOWS11_VM_FIRMWARE=uefi-secureboot
WINDOWS11_VM_MACHINE=q35
WINDOWS11_VM_CPU_MODE=host-passthrough
WINDOWS11_VM_TPM=2.0
WINDOWS11_VM_DISK_BUS=virtio
WINDOWS11_VM_NET_MODEL=virtio
WINDOWS11_VM_DISPLAY=spice
WINDOWS11_VM_VIDEO=virtio
WINDOWS11_VM_AUDIO=pipewire
WINDOWS11_VM_USB_REDIRECTION=true
WINDOWS11_VM_VIRTIO_DRIVER_ISO_REQUIRED=true
WINDOWS11_VM_INSTALL_ISO_RUNTIME_REQUIRED=true
