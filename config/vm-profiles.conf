# Optional KVM guest profiles. These profiles are NOT created during workstation installation.
# They are templates for on-demand VM creation through the KVM control tooling.

VM_PROFILE_DEFAULT_NETWORK=devops-nat
VM_PROFILE_DEFAULT_POOL=devops-data
VM_PROFILE_AUTOSTART=false

# Ubuntu Desktop 26.04 LTS — accelerated virtual desktop.
UBUNTU_DESKTOP_NAME=ubuntu-desktop
UBUNTU_DESKTOP_OS=ubuntu-desktop-26.04-lts
UBUNTU_DESKTOP_VCPU=6
UBUNTU_DESKTOP_RAM_MB=8192
UBUNTU_DESKTOP_DISK_GB=100
UBUNTU_DESKTOP_DISK_FORMAT=qcow2
UBUNTU_DESKTOP_FIRMWARE=uefi
UBUNTU_DESKTOP_MACHINE=q35
UBUNTU_DESKTOP_CPU_MODE=host-passthrough
UBUNTU_DESKTOP_VIDEO=virtio
UBUNTU_DESKTOP_VIDEO_ACCEL3D=true
UBUNTU_DESKTOP_GRAPHICS=spice-gl
UBUNTU_DESKTOP_OPENGL=true
UBUNTU_DESKTOP_RENDER_NODE=/dev/dri/renderD128
UBUNTU_DESKTOP_DISPLAY_LISTEN=none
UBUNTU_DESKTOP_CHANNEL_SPICE_AGENT=true
UBUNTU_DESKTOP_USB_REDIR=true
UBUNTU_DESKTOP_AUDIO=pipewire
UBUNTU_DESKTOP_NETWORK=devops-nat

# Windows 11 — general-purpose desktop VM.
WINDOWS11_NAME=windows-11
WINDOWS11_OS=windows-11
WINDOWS11_VCPU=8
WINDOWS11_RAM_MB=16384
WINDOWS11_DISK_GB=200
WINDOWS11_DISK_FORMAT=qcow2
WINDOWS11_FIRMWARE=uefi-secureboot
WINDOWS11_MACHINE=q35
WINDOWS11_CPU_MODE=host-passthrough
WINDOWS11_TPM_VERSION=2.0
WINDOWS11_TPM_BACKEND=emulator
WINDOWS11_DISK_BUS=virtio
WINDOWS11_NETWORK_MODEL=virtio
WINDOWS11_VIDEO=virtio
WINDOWS11_GRAPHICS=spice
WINDOWS11_CHANNEL_SPICE_AGENT=true
WINDOWS11_USB_REDIR=true
WINDOWS11_AUDIO=pipewire
WINDOWS11_NETWORK=devops-nat
WINDOWS11_REQUIRE_VIRTIO_ISO=true

# GPU passthrough is intentionally not the default. The host owns the Intel Arc B580.
# Ubuntu Desktop uses virgl/virtio-gpu accelerated 3D through the host render node,
# which preserves the host desktop while providing the best maintainable shared-GPU path.
VM_PROFILE_GPU_PASSTHROUGH_DEFAULT=false
