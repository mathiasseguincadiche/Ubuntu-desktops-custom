# Virtualization configuration — KVM custom NAT
LIBVIRT_URI=qemu:///system
KVM_NETWORK_NAME=devops-nat
KVM_BRIDGE_NAME=virbr50
KVM_NETWORK_CIDR=192.168.50.0/24
KVM_GATEWAY=192.168.50.254
KVM_NETMASK=255.255.255.0
KVM_DHCP_START=192.168.50.100
KVM_DHCP_END=192.168.50.200
KVM_DNS_1=9.9.9.9
KVM_DNS_2=1.1.1.1
KVM_BLOCK_PHYSICAL_LAN=true
KVM_PHYSICAL_LAN_DETECTION=dynamic-host-routes
KVM_ROUTE_OVERLAP_ACTION=block
KVM_PRESERVE_EXISTING_FIREWALL=true
KVM_ALLOW_HOST_VM=true
KVM_ALLOW_VM_VM=true
KVM_ALLOW_VM_INTERNET=true
KVM_ALLOW_INBOUND_FORWARDING=false
KVM_HOST_PARTICIPATES=true
KVM_HOST_ADDRESS=192.168.50.254
# Architecture gate. Must remain false until PRE-TEST READY and explicit approval.
REAL_MACHINE_APPROVED=false
