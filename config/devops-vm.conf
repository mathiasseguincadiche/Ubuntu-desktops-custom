# Ubuntu Server DevOps VM
VM_DEVOPS_NAME=ubuntu-devops
VM_DEVOPS_OS=ubuntu-server-26.04-lts
VM_DEVOPS_IMAGE=ubuntu-26.04-server-cloudimg-amd64.img
VM_DEVOPS_RAM_MB=16384
VM_DEVOPS_VCPU=8
VM_DEVOPS_DISK_GB=200
VM_DEVOPS_DISK_FORMAT=qcow2
VM_DEVOPS_NETWORK=devops-nat
VM_DEVOPS_ADDRESS_MODE=dhcp-reservation
VM_DEVOPS_DHCP_RESERVATION_IP=
VM_DEVOPS_DHCP_RESERVATION_MAC=
VM_DEVOPS_CLOUD_INIT=true
VM_DEVOPS_SSH_KEY_ONLY=true
VM_DEVOPS_AUTOSTART=false
VM_DEVOPS_VERSION_POLICY=resolve-latest-supported-stable-at-pretest
# Reservation IP/MAC are intentionally unset until the deterministic VM identity
# is generated during the implementation phase. The chosen reservation must be
# conflict-checked and remain within the configured DHCP pool 192.168.50.100-200.
# Usernames, public keys and all credentials are runtime inputs and are never
# committed to this repository.
