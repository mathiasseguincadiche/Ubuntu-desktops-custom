# Ubuntu Server DevOps VM
VM_DEVOPS_NAME=ubuntu-devops
VM_DEVOPS_RAM_MB=16384
VM_DEVOPS_VCPU=8
VM_DEVOPS_DISK_GB=200
VM_DEVOPS_NETWORK=devops-nat
VM_DEVOPS_ADDRESS_MODE=dhcp-reservation
VM_DEVOPS_DHCP_RESERVATION_IP=
VM_DEVOPS_DHCP_RESERVATION_MAC=
# Reservation IP/MAC are intentionally unset until the deterministic VM identity
# is generated during the implementation phase. The address must be outside
# conflicting allocations and conform to the network manifest.
