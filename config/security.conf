ALLOW_CURL_PIPE_BASH=false
ALLOW_APT_KEY=false
ALLOW_UNGUARDED_DESTRUCTIVE_COMMANDS=false

# REAL APPLY mutation watchdog.
# A child process held in Linux job-control state T/T+ is never allowed to stay
# silent indefinitely. One bounded SIGCONT is attempted after the grace period;
# if privilege or repeated-stop conditions prevent recovery, explicit operator
# action is required and no destructive kill is issued automatically.
MUTATION_WATCHDOG_ENABLED=true
MUTATION_WATCHDOG_POLL_SECONDS=1
MUTATION_WATCHDOG_STOP_GRACE_SECONDS=5
MUTATION_WATCHDOG_AUTO_CONTINUE=true
MUTATION_WATCHDOG_MAX_AUTO_CONTINUES=1
