# Ubuntu-desktops-custom desktop application packaging policy
# Format: APP_ID|MODE|PREFERRED|APT_PACKAGE|SNAP_NAME|FLATPAK_ID|SOURCE_HINT|RATIONALE
#
# MODE:
#   managed  = the project converges the application to PREFERRED
#   preserve = Ubuntu owns the default application; inventory only, no migration
#
# PREFERRED:
#   apt        = Ubuntu archive package
#   vendor-apt = publisher-maintained signed APT repository
#   vendor-deb = publisher-maintained verified DEB release
#   snap       = Snap Store package
#   flatpak    = Flatpak/Flathub package
#
# SOURCE_HINT:
#   vendor-apt = expected repository origin hostname
#   flatpak    = expected Flatpak remote
#   otherwise  = '-'
#
# Only applications intentionally managed by the workstation are listed here.

firefox|managed|vendor-apt|firefox|firefox|org.mozilla.firefox|packages.mozilla.org|Mozilla recommends its signed DEB repository on Debian/Ubuntu; Resolute is explicitly supported and the native package avoids Snap confinement differences
proton-mail|managed|vendor-deb|proton-mail|-|-|-|Proton publishes an official Linux DEB and SHA-512 metadata; the project installs the latest Stable release only after checksum verification
libreoffice|managed|apt|libreoffice|libreoffice|org.libreoffice.LibreOffice|-|LibreOffice recommends the installation method provided by the Linux distribution for optimal system integration
obs-studio|managed|flatpak|obs-studio|obs-studio|com.obsproject.Studio|flathub|OBS recommends its first-party Flatpak when a supported Ubuntu PPA build is unavailable; the official PPA currently has no Resolute publication
filezilla|managed|apt|filezilla|filezilla|org.filezillaproject.Filezilla|-|Ubuntu archive package gives native integration and managed updates; FileZilla does not publish a preferred Ubuntu vendor repository
gnome-extension-manager|managed|flatpak|gnome-shell-extension-manager|-|com.mattjakeman.ExtensionManager|flathub|Extension Manager upstream explicitly recommends its Flathub build and does not guarantee support for independently maintained distro packages
remmina|managed|apt|remmina|remmina|org.remmina.Remmina|-|Remmina supports Ubuntu APT and its native package retains keyring, SSH agent and host integration; remmina-next currently has no Resolute suite
ghostwriter|managed|apt|ghostwriter|-|org.kde.ghostwriter|-|KDE documents a PPA but it does not publish Resolute; Ubuntu 26.04 ships a current upstream Ghostwriter release natively
ptyxis|managed|apt|ptyxis|-|-|-|Ubuntu GNOME package provides the intended host-native terminal without sandbox restrictions
xournalpp|managed|apt|xournalpp|-|com.github.xournalpp.xournalpp|-|Xournal++ upstream recommends the stable release and explicitly documents Ubuntu 22.04+ official repositories as a latest-stable installation path
vscode|managed|vendor-apt|code|code|com.visualstudio.code|packages.microsoft.com|Microsoft official signed APT repository provides the native supported Debian/Ubuntu package and controlled updates
brave|managed|vendor-apt|brave-browser|brave|com.brave.Browser|brave-browser-apt-release.s3.brave.com|Brave explicitly recommends its native Linux repository over Snap or Flatpak when available
bitwarden|managed|flatpak|bitwarden|bitwarden|com.bitwarden.desktop|flathub|Bitwarden recommends Snap or Flatpak for automatic updates and biometrics; Flatpak additionally supports sandboxed browser-extension biometric integration and process isolation
onlyoffice|managed|vendor-apt|onlyoffice-desktopeditors|onlyoffice-desktopeditors|org.onlyoffice.desktopeditors|download.onlyoffice.com|ONLYOFFICE documents its signed repository as the better Debian/Ubuntu installation option and it integrates with APT updates
drawio|managed|vendor-deb|drawio|drawio|com.jgraph.drawio.desktop|-|Use the publisher GitHub DEB with SHA-256 verification rather than an unrelated store build
steam|managed|vendor-apt|steam-launcher|steam|com.valvesoftware.Steam|repo.steampowered.com|Valve publishes and documents its own signed stable APT repository for the Steam launcher on Ubuntu
vlc|managed|snap|vlc|vlc|org.videolan.VLC|-|VideoLAN uses its Snap to deliver current major VLC releases directly with codec and optical-media support while Ubuntu DEB stays on the distro major version
