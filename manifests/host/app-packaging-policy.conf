# Ubuntu-desktops-custom desktop application packaging policy
# Format: APP_ID|MODE|PREFERRED|APT_PACKAGE|SNAP_NAME|FLATPAK_ID|RATIONALE
#
# MODE:
#   managed  = the project converges the application to PREFERRED
#   preserve = Ubuntu owns the default application; inventory only, no migration
#
# PREFERRED:
#   apt        = Ubuntu archive package
#   vendor-apt = publisher-maintained signed APT repository
#   vendor-deb = publisher-maintained verified DEB release
#   snap       = Snap Store package
#   flatpak    = Flatpak/Flathub package
#
# This manifest is also the semantic map used by the read-only diagnostic to
# detect cross-manager duplicates. '-' means that manager is intentionally not
# used as a detection alias for that application.

firefox|preserve|snap|-|firefox|org.mozilla.firefox|Ubuntu default; preserve Canonical integration and do not migrate automatically
thunderbird|preserve|snap|-|thunderbird|org.mozilla.Thunderbird|Ubuntu default; preserve Canonical integration and do not migrate automatically
libreoffice|managed|apt|libreoffice|libreoffice|org.libreoffice.LibreOffice|Ubuntu archive package integrates natively with the desktop and system libraries
obs-studio|managed|apt|obs-studio|obs-studio|com.obsproject.Studio|Ubuntu package is the reproducible baseline; publisher channels may be reviewed separately when a newer feature is required
filezilla|managed|apt|filezilla|filezilla|org.filezillaproject.Filezilla|Ubuntu archive package is sufficient and integrates natively
pdfarranger|managed|apt|pdfarranger|-|com.github.jeromerobert.pdfarranger|Ubuntu archive package is sufficient and integrates natively
gnome-extension-manager|managed|apt|gnome-shell-extension-manager|-|com.mattjakeman.ExtensionManager|Use Ubuntu package for GNOME integration; extensions remain user-managed
remmina|managed|apt|remmina|remmina|org.remmina.Remmina|Ubuntu archive package plus protocol plugins is the supported workstation baseline
ghostwriter|managed|apt|ghostwriter|-|org.kde.ghostwriter|Ubuntu 26.04 package is maintained and avoids an additional application runtime
ptyxis|managed|apt|ptyxis|-|-|Ubuntu GNOME terminal package provides the intended native integration
vscode|managed|vendor-apt|code|code|com.visualstudio.code|Microsoft official signed APT repository gives native integration and controlled repository provenance
brave|managed|vendor-apt|brave-browser|brave|com.brave.Browser|Brave explicitly recommends its native repository over Snap or Flatpak when available
bitwarden|managed|flatpak|bitwarden|bitwarden|com.bitwarden.desktop|Flatpak is publisher-supported and provides process isolation; biometric policy is handled separately if requested
onlyoffice|managed|flatpak|onlyoffice-desktopeditors|onlyoffice-desktopeditors|org.onlyoffice.desktopeditors|Publisher-supported Flatpak keeps the large desktop suite isolated and automatically updated
 drawio|managed|vendor-deb|drawio|drawio|com.jgraph.drawio.desktop|Use the publisher GitHub DEB with SHA-256 verification rather than an unrelated store build
steam|managed|apt|steam-installer|steam|com.valvesoftware.Steam|Ubuntu package integrates with the host multiarch Mesa stack required by the project
vlc|managed|apt|vlc|vlc|org.videolan.VLC|Ubuntu archive package integrates with the host codec and GStreamer stack
