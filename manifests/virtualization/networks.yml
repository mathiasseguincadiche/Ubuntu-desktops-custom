networks:
  devops-nat:
    scope: KVM
    mode: nat
    cidr: 192.168.50.0/24
    gateway: 192.168.50.254
    netmask: 255.255.255.0
    dhcp:
      start: 192.168.50.100
      end: 192.168.50.200
    dns:
      - 9.9.9.9
      - 1.1.1.1
    policy:
      vm_to_internet: allow
      vm_to_vm: allow
      host_to_vm: allow
      vm_to_host: allow
      vm_to_physical_lan: block
      physical_lan_to_vm: block
      internet_to_vm: block
      inbound_port_forwarding: disabled
    reserved_ranges:
      infrastructure: 192.168.50.2-99
      future: 192.168.50.201-253
